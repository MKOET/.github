name: Bug Report
description: Report a bug in an MKOET repository
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Repository version, commit hash, or release tag
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, dependencies
      placeholder: |
        OS: Windows 11
        Node: 22.23.2
        Python: 3.12
    validations:
      required: false